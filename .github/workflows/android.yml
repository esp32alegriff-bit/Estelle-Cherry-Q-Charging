name: Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Estelle-Cherry-Q-EF_1.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare public APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/debug/app-debug.apk Estelle-Cherry-Q-Charging-EF_1.1.apk

      - name: Publish EF_1.1 release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view EF_1.1 >/dev/null 2>&1 ||             gh release create EF_1.1               --title "Estelle Cherry Q Charging EF_1.1"               --notes "Approved neon UI update with charging session Started, Current time, Elapsed, and Ended fields."
          gh release upload EF_1.1 Estelle-Cherry-Q-Charging-EF_1.1.apk --clobber
