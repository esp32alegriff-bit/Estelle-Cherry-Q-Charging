name: Android APK

on:
  push:
    branches: [main]
    tags: ["EF_*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build and lint pull request
        if: github.event_name == 'pull_request'
        run: gradle :app:assembleDebug :app:lintDebug --stacktrace

      - name: Restore permanent release keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/estelle-release.jks"
          chmod 600 "$RUNNER_TEMP/estelle-release.jks"

      - name: Build signed release APK and lint
        if: github.event_name != 'pull_request'
        env:
          FARRUSCO_SIGNING_STORE_FILE: ${{ runner.temp }}/estelle-release.jks
          FARRUSCO_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          FARRUSCO_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          FARRUSCO_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:lintRelease --stacktrace

      - name: Upload signed workflow artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Estelle-Cherry-Q-Charging-${{ github.ref_name }}-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/EF_')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Estelle-Cherry-Q-Charging-${GITHUB_REF_NAME}.apk"
          NOTES="docs/${GITHUB_REF_NAME}-release-notes.md"
          if [ ! -f "$NOTES" ]; then NOTES="README.md"; fi
          gh release create "$GITHUB_REF_NAME" "Estelle-Cherry-Q-Charging-${GITHUB_REF_NAME}.apk" \
            --verify-tag \
            --title "Estelle Cherry Q Charging ${GITHUB_REF_NAME}" \
            --notes-file "$NOTES"
